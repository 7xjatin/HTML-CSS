<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        #rs {
            color: red;
        }
    </style>
</head>

<body>

    <form action="">
        <label>Number 1</label>
        <input type="text" placeholder="Enter your number 1" id="a">

        <br><br>

        <label>Number 2</label>
        <input type="text" placeholder="Enter your number 2" id="b">

        <br><br>

        <button id="minus">-</button>
        <button id="add">+</button>
        <button id="multiply">*</button>
        <button id="divide">/</button>
    </form>

    <h1>Result :- <span id="rs"></span></h1>

    <script>

        var a = document.getElementById('a');
        var b = document.getElementById('b');
        var result = document.getElementById('rs');

        document.getElementById('minus').addEventListener('click', function(e) {
            e.preventDefault();

            var minus = parseInt(a.value) - parseInt(b.value);
            result.innerHTML = minus;
        });


        document.getElementById('add').addEventListener('click', function(e) {
            e.preventDefault();

            var add = parseInt(a.value) + parseInt(b.value);
            result.innerHTML = add;
        });


        document.getElementById('multiply').addEventListener('click', function(e) {
            e.preventDefault();

            var multiply = parseInt(a.value) * parseInt(b.value);
            result.innerHTML = multiply;
        });


        document.getElementById('divide').addEventListener('click', function(e) {
            e.preventDefault();

            var divide = parseInt(a.value) / parseInt(b.value);
            result.innerHTML = divide;
        });

    </script>

</body>
</html>
